mcp_servers:
  composio:
    url: https://connect.composio.dev/mcp
    auth: oauth
  chrome-devtools:
    command: npx
    args:
      - -y
      - chrome-devtools-mcp@latest
      - --autoConnect
      - --channel=beta
  dbx-mcp:
    command: dbx-mcp
    timeout: 120
    connect_timeout: 60
    enable: true
  gemini-notebook-lm:
    command: uvx
    args:
      - --from
      - notebooklm-mcp-cli
      - notebooklm-mcp
    timeout: 120
    connect_timeout: 60
    enabled: true
  codegraph:
    command: codegraph
    args:
      - serve
      - --mcp
    timeout: 120
    connect_timeout: 60
    enabled: true
  drawio:
    command: npx
    args:
      - "@drawio/mcp"
    timeout: 120
    connect_timeout: 60
    enabled: true
  mnemosyne:
    command: mnemosyne
    args:
      - mcp
    timeout: 120
    connect_timeout: 60
    enabled: true
  linear:
    url: https://mcp.linear.app/mcp
    auth: oauth
    enabled: true
  bruno:
    command: /home/aioz/.local/bin/node
    args:
      - /home/aioz/.local/src/bruno-mcp/dist/index.js
      - --collection
      - /home/aioz/Documents/bruno/aiozstream
    timeout: 120
    connect_timeout: 60
    enabled: true
