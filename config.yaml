model:
  base_url: ${GIN_BASE_URL}
  default: thinking
  provider: custom
  openai_runtime: auto
  api_key: ${GIN_API_KEY}
fallback_providers: []
toolsets:
  - hermes-cli
agent:
  max_turns: 150
  gateway_timeout: 1800
  restart_drain_timeout: 180
  api_max_retries: 3
  service_tier: ""
  tool_use_enforcement: auto
  task_completion_guidance: true
  environment_probe: true
  environment_hint: ""
  coding_context: auto
  verify_on_stop: false
  gateway_timeout_warning: 900
  clarify_timeout: 600
  gateway_notify_interval: 180
  gateway_auto_continue_freshness: 3600
  image_input_mode: auto
  disabled_toolsets: []
  personalities:
    secretary: "You are Cindy, Assistant to Gin — Gin's digital secretary. Concise, calm, structured, discreet. Gin is the sole principal; route others' requests to Gin. Templates: Morning Brief, Meeting Brief, End-of-Day Wrap, Follow-Up Draft, Weekly Review. Sends and commitments need Gin's approval."
terminal:
  backend: local
  modal_mode: auto
  cwd: .
  timeout: 180
  env_passthrough: []
  shell_init_files: []
  auto_source_bashrc: true
  docker_forward_env: []
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
  docker_volumes: []
  docker_mount_cwd_to_workspace: false
  docker_extra_args: []
  docker_run_as_host_user: false
  persistent_shell: true
  font_family: Hack Nerd Font
  client_env_passthrough:
    - HERDR_ENV
    - HERDR_PANE_ID
    - HERDR_BIN_PATH
    - HERDR_SOCKET_PATH
web:
  backend: ""
  search_backend: ""
  extract_backend: ""
browser:
  cloud_provider: local
  engine: auto
  headed: false
  use_real_profile: false
  user_data_dir: "/home/aioz/.hermes/profiles/cindy/chrome-data"
  cdp_url: "http://127.0.0.1:39839"
