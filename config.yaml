    - weights-and-biases
    - xurl
    - youtube-content
    - yuanbao
curator:
  enabled: true
  interval_hours: 168
  min_idle_hours: 2
  stale_after_days: 14
  archive_after_days: 30
  prune_builtins: true
  backup:
    enabled: true
    keep: 5
timezone: ""
slack:
  require_mention: true
  free_response_channels: ""
  allowed_channels: ""
discord:
  require_mention: true
  free_response_channels: ""
  allowed_channels: ""
  auto_thread: true
  thread_require_mention: false
  history_backfill: true
  history_backfill_limit: 50
  reactions: true
  dm_role_auth_guild: ""
  server_actions: ""
  allow_any_attachment: false
  max_attachment_bytes: 33554432
  voice_fx:
    enabled: false
    ambient_enabled: true
    ambient_path: ""
    ambient_gain: 0.18
    duck_gain: 0.06
    speech_gain: 1.0
    ack_enabled: true
    ack_phrases:
      - Let me look into that.
      - One moment.
      - Checking on that now.
      - Give me a sec.
      - On it.
telegram:
  reactions: false
  allowed_chats: ""
mattermost:
  require_mention: true
  free_response_channels: ""
  allowed_channels: ""
matrix:
  require_mention: true
  free_response_rooms: ""
  allowed_rooms: ""
approvals:
  mode: smart
  timeout: 60
  cron_mode: deny
  mcp_reload_confirm: true
  destructive_slash_confirm: true
command_allowlist: []
plugins:
  hermes-memory-store:
    auto_extract: "true"
    db_path: ~/.hermes/profiles/cindy/memory_store.db
    default_trust: "0.5"
    hrr_dim: "1024"
  enabled:
    - advanced-delegation
    - ginflow-gate
    - ginflow-routing
    - herdr-agent-state
    - herdr-gateway-session
    - validated-mistery-loop
  disabled: []
hooks_auto_accept: false
security:
  allow_private_urls: false
  redact_secrets: true
  website_blocklist:
    enabled: false
    domains: []
    shared_files: []
  acked_advisories: []
  allow_lazy_installs: true
cron:
  wrap_response: true
kanban:
  dispatch_in_gateway: true
  dispatch_interval_seconds: 60
  failure_limit: 2
  worker_log_rotate_bytes: 2097152
  worker_log_backup_count: 1
  orchestrator_profile: ""
  default_assignee: ""
  auto_decompose: false
  auto_decompose_per_tick: 3
  dispatch_stale_timeout_seconds: 14400
code_execution:
  mode: project
tools:
  tool_search:
    enabled: auto
    threshold_pct: 10
    search_default_limit: 5
    max_search_limit: 20
logging:
  level: INFO
  max_size_mb: 5
  backup_count: 3
model_catalog:
  enabled: true
  url: https://hermes-agent.nousresearch.com/docs/api/model-catalog.json
network:
  force_ipv4: false
gateway:
  strict: false
  media_delivery_allow_dirs: []
  trust_recent_files: true
  trust_recent_files_seconds: 600
streaming:
  enabled: false
  transport: auto
  edit_interval: 0.8
  buffer_threshold: 24
  cursor: " ▉"
  fresh_final_after_seconds: 60.0
sessions:
  auto_prune: false
  retention_days: 90
  vacuum_after_prune: true
  min_interval_hours: 24
  write_json_snapshots: false
onboarding:
  seen:
    tool_progress_prompt: true
  profile_build: ask
updates:
  pre_update_backup: false
  backup_keep: 5
  non_interactive_local_changes: stash
lsp:
  enabled: true
  wait_mode: document
  wait_timeout: 5.0
  install_strategy: auto
x_search:
  model: grok-4.20-reasoning
  timeout_seconds: 180
  retries: 2
secrets:
  bitwarden:
    enabled: false
    access_token_env: BWS_ACCESS_TOKEN
    project_id: ""
    cache_ttl_seconds: 300
    override_existing: true
    auto_install: true
    server_url: ""
paste_collapse_threshold: 5
paste_collapse_threshold_fallback: 5
paste_collapse_char_threshold: 2000
_config_version: 52
